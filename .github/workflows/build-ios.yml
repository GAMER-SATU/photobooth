name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Duet Photobooth iOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build App for iOS Device (Release)
        run: |
          xcodebuild clean build \
            -project ios/DuetPhotobooth.xcodeproj \
            -scheme DuetPhotobooth \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload (.ipa)
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "DuetPhotobooth.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build-output/Payload/
          cd build-output
          zip -r DuetPhotobooth.ipa Payload
          zip -r DuetPhotobooth-App.zip Payload/DuetPhotobooth.app

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuetPhotobooth-iOS-Build
          path: build-output/
